name: Domestic migration CI — Raz Sahra

on:
  push:
    branches: ["feat/mysql-domestic-hosting"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: razsahra-domestic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: razsahra_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks and repository contract checks
        run: npm run check
      - name: Validate MySQL integration test syntax
        run: node --check scripts/test-mysql-schema.mjs
      - name: Validate the guarded CMS data-transfer utility syntax
        run: node --check scripts/migrate-cms-data.mjs
      - name: Apply and verify schema against disposable MySQL 8.4
        env:
          TARGET_MYSQL_URL: mysql://root:ci-root-password@127.0.0.1:3306/razsahra_ci
        run: node scripts/test-mysql-schema.mjs && node scripts/check-mysql-connection.mjs
      - name: Exercise Node/MySQL CMS API against disposable schema
        env:
          TARGET_MYSQL_URL: mysql://root:ci-root-password@127.0.0.1:3306/razsahra_ci
          TEST_ADMIN_BOOTSTRAP_SECRET: ci-only-bootstrap-secret-with-at-least-32-characters
        run: node scripts/test-mysql-cms-api.mjs
      - name: Smoke-test domestic Node HTTP server and Madar deep links
        env:
          TARGET_MYSQL_URL: mysql://root:ci-root-password@127.0.0.1:3306/razsahra_ci
        run: node scripts/test-domestic-node-server.mjs
      - name: Build static site bundle
        env:
          SITE_URL: https://razsahra.pages.dev
          SITE_BUILD_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Verify expected output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/assets/raz-sahra-premium.css
          test -s dist/assets/raz-sahra-cms-runtime.js
          test -s dist/_headers
          test -s dist/manifest.webmanifest
      - name: Upload build artifact for review (not a production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: razsahra-static-ci-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
