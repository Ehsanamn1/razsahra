name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML, required routes, and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          html = Path("index.html").read_text(encoding="utf-8")
          expected = {"home", "about", "business", "supply", "partnerships", "contact", "insights", "privacy"}
          found = set(re.findall(r'data-page="([^"]+)"', html))
          missing = expected - found
          if missing:
              raise SystemExit("Missing page views: " + ", ".join(sorted(missing)))
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit("Expected one inline application script")
          Path("/tmp/raz-sahra-app.js").write_text(scripts[0], encoding="utf-8")
          ET.parse("sitemap.xml")
          if 'lang="fa"' not in html or 'dir="rtl"' not in html:
              raise SystemExit("Persian language and RTL direction must be set")
          print("Static checks passed: all 8 page views, Persian RTL, and sitemap XML.")
          PY
          node --check /tmp/raz-sahra-app.js
          node --check assets/raz-sahra-interactions.js
          test -f assets/raz-sahra-premium.css
          test -f assets/raz-sahra-icon.svg
          test -f manifest.webmanifest
          grep -q 'assets/raz-sahra-premium.css' index.html
          grep -q 'assets/raz-sahra-interactions.js' index.html
          grep -q '"lang": "fa"' manifest.webmanifest
          if grep -qi 'unsplash.com' index.html; then echo "Unexpected stock-photo URL found"; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import json
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("dir") != "rtl" or manifest.get("lang") != "fa":
              raise SystemExit("Manifest must be Persian and RTL")
          if not Path("assets/raz-sahra-icon.svg").is_file():
              raise SystemExit("Missing branded SVG icon")
          print("Asset, PWA manifest, script syntax, and source checks passed.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
