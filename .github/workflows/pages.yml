name: Build and deploy Raz Sahra to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://razsahra.pages.dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate frontend, API, schema and build
        run: |
          npm run check
          npm run build
          node --check 'functions/api/[[path]].js'
          test -f dist/index.html
          test -f dist/assets/raz-sahra-premium.css
          test -f dist/assets/raz-sahra-cms-runtime.js
          test -f dist/_headers
          test -f dist/manifest.webmanifest

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler pages deploy dist --project-name=razsahra --branch=main

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Build and checks succeeded, but Cloudflare deployment was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Set CLOUDFLARE_API_TOKEN as a GitHub Actions secret and CLOUDFLARE_ACCOUNT_ID as a repository variable or secret; create the Pages project 'razsahra' and re-run the workflow." >> "$GITHUB_STEP_SUMMARY"
