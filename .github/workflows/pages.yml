name: Build and deploy Raz Sahra to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate frontend, API, schema and build
        run: |
          npm run check
          npm run build
          node --check 'functions/api/[[path]].js'
          test -f dist/index.html
          test -f dist/assets/raz-sahra-premium.css
          test -f dist/manifest.webmanifest
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://razsahra.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=razsahra --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
