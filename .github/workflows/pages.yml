name: Build and deploy Raz Sahra to Cloudflare Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull-request validation must never cancel an in-flight production release.
  group: ${{ github.event_name == 'pull_request' && format('cloudflare-pages-pr-{0}', github.event.pull_request.number) || 'cloudflare-pages-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://razsahra.pages.dev' }}
      SITE_BUILD_VERSION: ${{ github.sha }}
      RAZ_SAHRA_DATABASE_URL: ${{ secrets.RAZ_SAHRA_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate frontend, API, schema and build
        run: |
          npm run check
          npm run build
          node --check 'functions/api/[[path]].js'
          test -f dist/index.html
          test -f dist/assets/raz-sahra-premium.css
          test -f dist/assets/raz-sahra-cms-runtime.js
          test -f dist/_headers
          test -f dist/manifest.webmanifest

      - name: Resolve pinned Medar source revision
        id: medar-source
        shell: bash
        run: |
          set -euo pipefail
          ref="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const pin = JSON.parse(readFileSync("integration/medar-source.json", "utf8")); if (pin.repository !== "Ehsanamn1/simorgh" || !/^[0-9a-f]{40}$/.test(pin.commit)) process.exit(2); process.stdout.write(pin.commit)')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using pinned Medar source revision: $ref"

      - name: Check out Medar source for same-origin app hosting
        uses: actions/checkout@v4
        with:
          repository: Ehsanamn1/simorgh
          ref: ${{ steps.medar-source.outputs.ref }}
          path: medar-src

      - name: Install Medar dependencies
        working-directory: medar-src
        run: npm install --no-audit --no-fund

      - name: Validate Medar source
        working-directory: medar-src
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build Medar under /madar with the same-origin API route
        working-directory: medar-src
        env:
          VITE_API_BASE_URL: /api/medar
          VITE_ENABLE_AUTH_UI: "true"
          VITE_DISABLE_API_UI: "false"
          VITE_APP_VERSION: ${{ github.sha }}-${{ steps.medar-source.outputs.ref }}
        run: npm run build -- --base=/madar/ --outDir ../dist/madar --emptyOutDir

      - name: Verify combined website and Medar artifact
        env:
          PARENT_SOURCE_SHA: ${{ github.sha }}
          MEDAR_SOURCE_SHA: ${{ steps.medar-source.outputs.ref }}
        run: |
          set -euo pipefail
          test -f dist/madar/index.html
          test -f dist/madar/manifest.webmanifest
          test -f dist/madar/sw.js
          grep -R -q '/api/medar' dist/madar/assets
          grep -q '/madar/' _redirects
          grep -Fxq '/madar/* /madar/index.html 200' _redirects
          # The app reports this build ID through its authenticated client-presence heartbeat.
          # Assert the exact parent+Medar revision pair exists in the built JavaScript bundle.
          grep -R -F -q "${PARENT_SOURCE_SHA}-${MEDAR_SOURCE_SHA}" dist/madar/assets

      - name: Ensure the intended Cloudflare Pages project exists
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          # Fail closed if account authentication/listing fails; only create when the
          # configured account was successfully queried and the project is absent.
          project_list="$(npx wrangler pages project list)"
          if grep -Eq '(^|[^[:alnum:]_-])razsahra([^[:alnum:]_-]|$)' <<< "$project_list"; then
            echo "Found Cloudflare Pages project razsahra in the configured account."
          else
            echo "Cloudflare Pages project razsahra is absent from the configured account; creating it with main as production branch."
            npx wrangler pages project create razsahra --production-branch=main
          fi

      - name: Ensure CMS database secret is configured before deployment
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RAZ_SAHRA_DATABASE_URL:-}" ]]; then
            # Push the dedicated Raz Sahra DB URL to Pages without printing it.
            printf '%s' "$RAZ_SAHRA_DATABASE_URL" | npx wrangler pages secret put DATABASE_URL --project-name=razsahra
            echo "Provisioned the Pages DATABASE_URL secret from the dedicated Raz Sahra GitHub secret."
          else
            # The value is never read back; this only checks whether the binding exists.
            configured_secrets="$(npx wrangler pages secret list --project-name=razsahra)"
            if grep -q 'DATABASE_URL' <<< "$configured_secrets"; then
              echo "A DATABASE_URL secret is already configured in the Cloudflare Pages project."
            else
              echo "::error::Missing the CMS database secret. Add Cloudflare Pages Production secret DATABASE_URL, or add GitHub Actions secret RAZ_SAHRA_DATABASE_URL so this workflow can provision it securely."
              echo "Required action: set Cloudflare Pages secret DATABASE_URL to the pooled connection string for the dedicated Neon project raz-sahra-site; alternatively set the GitHub Actions secret RAZ_SAHRA_DATABASE_URL." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          npx wrangler pages deploy dist --project-name=razsahra --branch=main 2>&1 | tee "$deploy_log"
          deployment_url="$(grep -Eo 'https://[[:alnum:]-]+\.razsahra\.pages\.dev' "$deploy_log" | tail -n 1 || true)"
          if [[ -z "$deployment_url" ]]; then
            echo "Cloudflare deploy succeeded without exposing its unique deployment URL in the log."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test deployed site, Madar route and backend
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          # Keep Cloudflare's smoke target separate from razsahra.ir, which will point to the domestic host after cutover.
          SITE_URL: ${{ vars.CLOUDFLARE_SMOKE_TEST_URL || 'https://razsahra.pages.dev' }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -uo pipefail
          failure=0
          for origin in "${SITE_URL%/}" "${DEPLOYMENT_URL%/}"; do
            [[ -n "$origin" ]] || continue
            echo "Checking deployment origin: $origin"
            public_home_file="$(mktemp)"
            public_home_status="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 --output "$public_home_file" --write-out '%{http_code}' "$origin/")" || public_home_status="curl-error"
            if [[ "$public_home_status" != "200" ]] || ! grep -Fq 'href="/madar/"' "$public_home_file" || ! grep -q 'id="madar-product-title"' "$public_home_file"; then
              echo "Public homepage is missing the integrated Medar entry point at $origin (HTTP $public_home_status)."
              failure=1
            else
              echo "Public Medar entry point verified: $origin/"
            fi
            rm -f "$public_home_file"
            for route in / /madar/; do
              body_file="$(mktemp)"
              status="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --output "$body_file" --write-out '%{http_code}' "$origin$route")" || status="curl-error"
              if [[ "$status" != "200" ]]; then
                echo "Unexpected HTTP $status for $route at $origin"
                head -c 300 "$body_file" || true
                echo
                failure=1
              else
                echo "HTTP 200: $origin$route"
              fi
              rm -f "$body_file"
            done
            nested_file="$(mktemp)"
            nested_status="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 --header 'Accept: text/html' --output "$nested_file" --write-out '%{http_code}' "$origin/madar/app/home")" || nested_status="curl-error"
            if [[ "$nested_status" != "200" ]] || ! grep -q 'id="root"' "$nested_file"; then
              echo "Madar deep-link refresh failed at $origin/madar/app/home (HTTP $nested_status)."
              head -c 250 "$nested_file" || true
              echo
              failure=1
            else
              echo "HTTP 200 and application shell verified: $origin/madar/app/home"
            fi
            rm -f "$nested_file"
            health_file="$(mktemp)"
            health_status="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --output "$health_file" --write-out '%{http_code}' "$origin/api/health")" || health_status="curl-error"
            if ! node -e 'const fs=require("node:fs");const raw=fs.readFileSync(process.argv[1],"utf8");const status=process.argv[2];let d;try{d=JSON.parse(raw)}catch{console.error("Health endpoint HTTP "+status+" returned non-JSON: "+raw.slice(0,250).replace(/\s+/g," "));process.exit(1)}if(status!=="200"||d.ok!==true||d.database!=="connected"){console.error("Health check failed: "+JSON.stringify({status,ok:d.ok,database:d.database,error:d.error&&d.error.code}));process.exit(1)}console.log("API healthy; Neon database connected.")' "$health_file" "$health_status"; then
              failure=1
            fi
            rm -f "$health_file"
            medar_health_file="$(mktemp)"
            medar_health_status="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --output "$medar_health_file" --write-out '%{http_code}' "$origin/api/medar/api/health")" || medar_health_status="curl-error"
            if ! node -e 'const fs=require("node:fs");const raw=fs.readFileSync(process.argv[1],"utf8");const status=process.argv[2];let d;try{d=JSON.parse(raw)}catch{console.error("Madar API health HTTP "+status+" returned non-JSON: "+raw.slice(0,250).replace(/\s+/g," "));process.exit(1)}if(status!=="200"||d.ok!==true||d.database!==true){console.error("Madar API health check failed: "+JSON.stringify({status,ok:d.ok,database:d.database,service:d.service,code:d.code}));process.exit(1)}console.log("Madar API healthy; upstream database connected.")' "$medar_health_file" "$medar_health_status"; then
              failure=1
            fi
            rm -f "$medar_health_file"
            admin_file="$(mktemp)"
            admin_status="$(curl --silent --show-error --output "$admin_file" --write-out '%{http_code}' --max-time 25 "$origin/api/admin/pages")" || admin_status="curl-error"
            case "$admin_status" in
              401|403) echo "Verified unauthenticated CMS admin access is denied (HTTP $admin_status) at $origin." ;;
              *) echo "CMS admin endpoint must deny unauthenticated access; received HTTP $admin_status at $origin." >&2; head -c 250 "$admin_file" || true; echo; failure=1 ;;
            esac
            rm -f "$admin_file"
          done
          exit "$failure"

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Build and checks succeeded, but Cloudflare deployment was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Set CLOUDFLARE_API_TOKEN as a GitHub Actions secret and CLOUDFLARE_ACCOUNT_ID as a repository variable or secret; create the Pages project 'razsahra' and re-run the workflow." >> "$GITHUB_STEP_SUMMARY"
