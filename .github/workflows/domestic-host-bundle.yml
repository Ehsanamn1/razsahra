name: Build domestic host bundle (staging)
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "host-package/**"
      - "assets/**"
      - "index.html"
      - "404.html"
      - "manifest.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/**"
      - "functions/**"
      - "integration/medar-source.json"
      - ".github/workflows/domestic-host-bundle.yml"
  push:
    branches: ["main", "feat/domestic-host-release-bundle"]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: razsahra_ci
          MYSQL_USER: razsahra_ci
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Checkout Raz Sahara
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install website build dependencies
        run: npm install --no-audit --no-fund
      - name: Validate website source
        run: npm run check
      - name: Build website
        env:
          SITE_URL: https://example.invalid/
          SITE_BUILD_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Assemble package static files
        run: |
          rm -rf host-package/dist
          mkdir -p host-package/dist
          cp -a dist/. host-package/dist/
      - name: Resolve immutable Medar source pin
        id: medar-source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('integration/medar-source.json', 'utf8'));
          if (manifest.repository !== 'Ehsanamn1/simorgh') throw new Error('Unexpected Medar repository in integration manifest.');
          if (!/^[0-9a-f]{40}$/.test(manifest.commit || '')) throw new Error('Medar source must be pinned to a full immutable commit SHA.');
          if (manifest.mountPath !== '/madar/' || manifest.apiBasePath !== '/api/medar') throw new Error('Medar integration paths do not match the host bundle contract.');
          console.log('repository=' + manifest.repository);
          console.log('commit=' + manifest.commit);
          NODE
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('integration/medar-source.json', 'utf8'));
          console.log('repository=' + manifest.repository);
          console.log('ref=' + manifest.commit);
          NODE
      - name: Checkout pinned Medar frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.medar-source.outputs.repository }}
          ref: ${{ steps.medar-source.outputs.ref }}
          path: simorgh-src
      - name: Validate pinned Medar source
        working-directory: simorgh-src
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
      - name: Build Medar for /madar/ with same-origin API proxy
        working-directory: simorgh-src
        env:
          VITE_API_BASE_URL: /api/medar
          VITE_ENABLE_AUTH_UI: "true"
          VITE_DISABLE_API_UI: "false"
          VITE_APP_VERSION: ${{ github.sha }}-${{ steps.medar-source.outputs.ref }}
        run: |
          npm run build -- --base=/madar/
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
      - name: Mount and verify the combined Raz Sahara + Medar web bundle
        env:
          PARENT_SOURCE_SHA: ${{ github.sha }}
          MEDAR_SOURCE_SHA: ${{ steps.medar-source.outputs.ref }}
        run: |
          set -euo pipefail
          test -s simorgh-src/dist/index.html
          mkdir -p host-package/dist/madar
          cp -a simorgh-src/dist/. host-package/dist/madar/
          test -s host-package/dist/index.html
          test -s host-package/dist/madar/index.html
          test -s host-package/dist/madar/manifest.webmanifest
          test -s host-package/dist/madar/sw.js
          test -d host-package/dist/madar/assets
          grep -R -q '/api/medar' host-package/dist/madar/assets
          grep -R -F -q "${PARENT_SOURCE_SHA}-${MEDAR_SOURCE_SHA}" host-package/dist/madar/assets
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("host-package/dist/madar/manifest.webmanifest","utf8"));if(m.start_url!=="./app/home"||m.scope!=="./")throw new Error("Madar PWA manifest start_url/scope mismatch");'
      - name: Install backend runtime dependencies and validate
        working-directory: host-package
        run: |
          npm install --no-audit --no-fund
          npm run check
          test -s schema.sql
          test -s dist/index.html
          ! grep -Eiq 'DROP[[:space:]]+(DATABASE|TABLE)|TRUNCATE[[:space:]]+TABLE' schema.sql
      - name: Run database-backed CMS and proxy smoke tests
        working-directory: host-package
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: razsahra_ci
          DB_USER: razsahra_ci
          DB_PASSWORD: ci-db-password
          ADMIN_BOOTSTRAP_SECRET: ci-bootstrap-secret-long-enough-for-tests-12345
          MEDAR_API_ORIGIN: http://127.0.0.1:4321
          PORT: 3210
        run: |
          npm run install:db
          node --input-type=module -e 'import http from "node:http"; http.createServer((req,res)=>{res.setHeader("content-type","application/json");res.end(JSON.stringify({ok:true,path:req.url}));}).listen(4321,"127.0.0.1");' &
          MOCK_PID=$!
          npm start > /tmp/raz-sahra-api.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" "$MOCK_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3210/api/health >/tmp/rs-health.json; then break; fi
            sleep 2
          done
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("/tmp/rs-health.json","utf8")); if(!x.ok||x.database!=="connected") process.exit(1);'
          curl -fsS -c /tmp/rs-cookies -H 'content-type: application/json' -H 'x-admin-bootstrap-secret: ci-bootstrap-secret-long-enough-for-tests-12345' -d '{"username":"ciadmin","email":"ci@example.test","password":"TestAdminPassword123!","display_name":"CI Admin"}' http://127.0.0.1:3210/api/auth/bootstrap-admin >/tmp/rs-bootstrap.json
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("/tmp/rs-bootstrap.json","utf8")); if(!x.ok||x.user?.role!=="admin") process.exit(1);'
          curl -fsS -b /tmp/rs-cookies http://127.0.0.1:3210/api/auth/me | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||x.user?.role!=="admin")process.exit(1);'
          curl -fsS -b /tmp/rs-cookies http://127.0.0.1:3210/api/admin/overview | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||!x.stats)process.exit(1);'
          curl -fsS -c /tmp/rs-user-cookies -H 'content-type: application/json' -d '{"username":"ciuser","email":"ciuser@example.test","password":"TestUserPassword123!","display_name":"CI User"}' http://127.0.0.1:3210/api/auth/register >/tmp/rs-register.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/rs-register.json","utf8"));if(!x.ok||x.user?.role!=="user")process.exit(1);'
          curl -fsS -b /tmp/rs-user-cookies http://127.0.0.1:3210/api/auth/me | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||x.user?.role!=="user")process.exit(1);'
          USER_ADMIN_STATUS=$(curl -sS -o /tmp/rs-user-admin.json -w '%{http_code}' -b /tmp/rs-user-cookies http://127.0.0.1:3210/api/admin/overview)
          test "$USER_ADMIN_STATUS" = "403"
          curl -fsS -b /tmp/rs-user-cookies -c /tmp/rs-user-cookies -X POST http://127.0.0.1:3210/api/auth/logout >/tmp/rs-logout.json
          curl -fsS -b /tmp/rs-user-cookies http://127.0.0.1:3210/api/auth/me | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||x.user!==null)process.exit(1);'
          BOOTSTRAP_AGAIN_STATUS=$(curl -sS -o /tmp/rs-bootstrap-again.json -w '%{http_code}' -H 'content-type: application/json' -H 'x-admin-bootstrap-secret: ci-bootstrap-secret-long-enough-for-tests-12345' -d '{"username":"secondadmin","email":"secondadmin@example.test","password":"AnotherPassword123!","display_name":"Second Admin"}' http://127.0.0.1:3210/api/auth/bootstrap-admin)
          test "$BOOTSTRAP_AGAIN_STATUS" = "409"
          curl -fsS -H 'content-type: application/json' -d '{"name":"CI Test","email":"ci@example.test","message":"Automated acceptance test inquiry"}' http://127.0.0.1:3210/api/inquiries | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||!x.inquiry?.id)process.exit(1);'
          curl -fsS -b /tmp/rs-cookies http://127.0.0.1:3210/api/admin/inquiries | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||!Array.isArray(x.inquiries)||x.inquiries.length<1)process.exit(1);'
          curl -fsS http://127.0.0.1:3210/madar/app/home | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:3210/api/medar/api/health | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const x=JSON.parse(s);if(!x.ok||x.path!=="/api/health")process.exit(1);'
          echo "Admin bootstrap, session lifecycle, role authorization, inquiry persistence, Medar SPA deep link, and same-origin API proxy passed."
      - name: Check live Medar operational API
        run: |
          curl --fail --silent --show-error --max-time 20 https://medar-ops.dengxiao445.workers.dev/api/health > /tmp/medar-live-health.json
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("/tmp/medar-live-health.json","utf8")); if(x.ok!==true) { console.error("Operational Medar API health check did not return ok:true"); process.exit(1); } console.log("Operational Medar API is reachable and reports healthy.");'
      - name: Run deployment preflight against MySQL and live Medar API
        working-directory: host-package
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: razsahra_ci
          DB_USER: razsahra_ci
          DB_PASSWORD: ci-db-password
          MEDAR_API_ORIGIN: https://medar-ops.dengxiao445.workers.dev
        run: npm run preflight
      - name: Add release manifest and host checklist
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const manifest = {
            name: 'Raz Sahara domestic host bundle',
            version: process.env.GITHUB_SHA,
            createdAt: new Date().toISOString(),
            runtime: 'Node.js 20+ / MySQL 8',
            hostCompatibility: 'HostMizbanFa support states shared hosting can run Node.js 20+; account-level setup and real-domain acceptance remain to be verified.',
            website: 'Included',
            cmsApi: 'Included baseline; acceptance tests still required',
            medar: 'Medar frontend mounted at /madar/; /api/medar proxies to the configured external operational Medar API. Backend is not yet ported to Node/MySQL.',
            deploymentStatus: 'STAGING ONLY — do not treat as production-ready'
          };
          await writeFile('host-package/RELEASE-MANIFEST.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          cat > host-package/HOST-CHECKLIST.txt <<'EOF'
          STATUS: STAGING PACKAGE — NOT CLEARED FOR PRODUCTION UNTIL TARGET-HOST ACCEPTANCE PASSES.
          Included: Raz Sahara static web build, Medar frontend mounted at /madar/, Node.js CMS/auth API, MySQL schema and installer.
          CI acceptance: MySQL-backed bootstrap/login/session/role checks, inquiry persistence, Medar deep-link/proxy checks, live Medar API health and preflight are run in GitHub Actions.
          HostMizbanFa support states shared hosting can run Node.js 20+; remaining external gate is account-level Node app setup and running acceptance paths on the real HTTPS domain. This cannot be proven from CI.
          Medar API still runs on the existing operational Worker/PostgreSQL service; it has not been ported to standalone Node/MySQL.
          Before deployment: configure DB credentials and a random ADMIN_BOOTSTRAP_SECRET in host environment; configure MEDAR_API_ORIGIN to the operational Medar Worker origin (for example https://medar-ops.dengxiao445.workers.dev); run npm run preflight; bootstrap admin once then remove the bootstrap secret; test /api/health, login/logout, admin CMS, inquiry flow, /madar/ and /madar/app/home deep links, Medar login, and role permissions.
          Never put secrets in this package or source control.
          EOF
      - name: Create ZIP
        run: |
          cd host-package
          zip -qr ../raz-sahra-host-package-staging.zip . -x "node_modules/*" ".env"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: raz-sahra-host-package-staging
          path: raz-sahra-host-package-staging.zip
          if-no-files-found: error
          retention-days: 14
      - name: Deploy and verify HostMizbanFa release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.HOST_DEPLOY_ENABLED == 'true' }}
        env:
          HOST_SSH_HOST: ${{ secrets.HOST_SSH_HOST }}
          HOST_SSH_PORT: ${{ secrets.HOST_SSH_PORT }}
          HOST_SSH_USER: ${{ secrets.HOST_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOST_SSH_KNOWN_HOSTS }}
          HOST_APP_DIR: ${{ vars.HOST_APP_DIR }}
          HOST_HEALTHCHECK_URL: ${{ vars.HOST_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in HOST_SSH_HOST HOST_SSH_PORT HOST_SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS HOST_APP_DIR HOST_HEALTHCHECK_URL; do
            case "$name" in
              HOST_SSH_HOST) value="$HOST_SSH_HOST" ;;
              HOST_SSH_PORT) value="$HOST_SSH_PORT" ;;
              HOST_SSH_USER) value="$HOST_SSH_USER" ;;
              SSH_PRIVATE_KEY) value="$SSH_PRIVATE_KEY" ;;
              SSH_KNOWN_HOSTS) value="$SSH_KNOWN_HOSTS" ;;
              HOST_APP_DIR) value="$HOST_APP_DIR" ;;
              HOST_HEALTHCHECK_URL) value="$HOST_HEALTHCHECK_URL" ;;
            esac
            if [[ -z "$value" ]]; then
              echo "::error::Automatic HostMizbanFa deployment is enabled but $name is missing."
              exit 1
            fi
          done
          [[ "$HOST_SSH_PORT" =~ ^[0-9]+$ ]] && (( HOST_SSH_PORT > 0 && HOST_SSH_PORT < 65536 )) || { echo "::error::HOST_SSH_PORT must be between 1 and 65535"; exit 1; }
          [[ "$HOST_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$HOST_APP_DIR" != "/" && "$HOST_APP_DIR" != *".."* ]] || { echo "::error::HOST_APP_DIR must be a dedicated absolute path without spaces or '..' segments"; exit 1; }
          node --input-type=module -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.pathname!=="/"||u.search||u.hash||u.username||u.password)process.exit(1)' "$HOST_HEALTHCHECK_URL" || { echo "::error::HOST_HEALTHCHECK_URL must be the HTTPS site origin, e.g. https://razsahra.ir"; exit 1; }
          BASE_URL="$(node --input-type=module -e 'console.log(new URL(process.argv[1]).origin)' "$HOST_HEALTHCHECK_URL")"
          test -s host-package/package-lock.json || { echo "::error::The generated Node package-lock.json is missing; refusing to deploy an unpinned dependency install."; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$HOST_SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || ssh-keygen -F "[$HOST_SSH_HOST]:$HOST_SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "::error::Pinned known_hosts does not contain HOST_SSH_HOST. Verify the fingerprint with HostMizbanFa before saving it."
            exit 1
          }

          TARGET="$HOST_SSH_USER@$HOST_SSH_HOST"
          APP_DIR_Q="$(printf '%q' "$HOST_APP_DIR")"
          DEPLOY_SHA_Q="$(printf '%q' "$GITHUB_SHA")"
          SSH_OPTS=(-i "$HOME/.ssh/id_ed25519" -p "$HOST_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes)
          RSYNC_RSH="ssh -i $HOME/.ssh/id_ed25519 -p $HOST_SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes"

          "${SSH_OPTS[@]}" "$TARGET" "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$APP_DIR" != "$HOME" ]] || { echo "HOST_APP_DIR cannot be the account home directory." >&2; exit 2; }
          case "$APP_DIR" in "$HOME"/*) ;; *) echo "HOST_APP_DIR must be inside the SSH account home directory." >&2; exit 2 ;; esac
          for command_name in node npm rsync tar curl; do
            command -v "$command_name" >/dev/null || { echo "Missing required remote command: $command_name" >&2; exit 2; }
          done
          node -e 'if(Number(process.versions.node.split(".")[0])<20){console.error("Node.js 20+ required");process.exit(2)};console.log("Remote runtime:",process.version)'
          test -d "$APP_DIR" || { echo "Application root does not exist: $APP_DIR" >&2; exit 3; }
          test -w "$APP_DIR" || { echo "Application root is not writable by the deployment user" >&2; exit 4; }
          REMOTE

          # Store a code-only backup outside the app directory before the first mutation.
          "${SSH_OPTS[@]}" "$TARGET" "APP_DIR=$APP_DIR_Q DEPLOY_SHA=$DEPLOY_SHA_Q bash -s" <<'REMOTE'
          set -euo pipefail
          BACKUP_DIR="$HOME/.razsahra-deploy-backups"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/razsahra-$DEPLOY_SHA.tar.gz"
          tar -czf "$BACKUP_FILE" \
            --exclude='./node_modules' --exclude='./node_modules/*' \
            --exclude='./tmp' --exclude='./tmp/*' \
            --exclude='./logs' --exclude='./logs/*' \
            --exclude='./uploads' --exclude='./uploads/*' \
            --exclude='./public/uploads' --exclude='./public/uploads/*' \
            --exclude='./.env' --exclude='./.env.*' \
            --exclude='./.htaccess' --exclude='./.well-known' --exclude='./.well-known/*' \
            -C "$APP_DIR" .
          test -s "$BACKUP_FILE"
          REMOTE

          DEPLOY_STARTED=1
          rollback_on_failure() {
            local rc=$?
            trap - EXIT
            if [[ "$rc" -ne 0 && "$DEPLOY_STARTED" == "1" ]]; then
              echo "::warning::Deployment failed; attempting to restore the previous application files."
              set +e
              "${SSH_OPTS[@]}" "$TARGET" "APP_DIR=$APP_DIR_Q DEPLOY_SHA=$DEPLOY_SHA_Q bash -s" <<'ROLLBACK'
          set -euo pipefail
          BACKUP_FILE="$HOME/.razsahra-deploy-backups/razsahra-$DEPLOY_SHA.tar.gz"
          RESTORE_DIR="$HOME/.razsahra-deploy-backups/restore-$DEPLOY_SHA"
          if [[ ! -s "$BACKUP_FILE" ]]; then echo "No release backup found." >&2; exit 5; fi
          rm -rf "$RESTORE_DIR"
          mkdir -p "$RESTORE_DIR"
          tar -xzf "$BACKUP_FILE" -C "$RESTORE_DIR"
          rsync -a --delete \
            --exclude='.env' --exclude='.env.*' --exclude='node_modules/' --exclude='tmp/' \
            --exclude='logs/' --exclude='uploads/' --exclude='public/uploads/' \
            --exclude='.htaccess' --exclude='.well-known/' \
            "$RESTORE_DIR/" "$APP_DIR/"
          rm -rf "$RESTORE_DIR"
          cd "$APP_DIR"
          if [[ -s package-lock.json && -s package.json ]]; then npm ci --omit=dev --no-audit --no-fund; fi
          mkdir -p tmp
          touch tmp/restart.txt
          echo "Previous application code restored."
          ROLLBACK
              local rollback_rc=$?
              if [[ "$rollback_rc" -ne 0 ]]; then
                echo "::error::Automatic rollback failed. The previous code backup remains under ~/.razsahra-deploy-backups on the host."
              else
                echo "Automatic rollback command completed."
              fi
            fi
            exit "$rc"
          }
          trap rollback_on_failure EXIT

          rsync -az --delete --delay-updates -e "$RSYNC_RSH" \
            --exclude='.env' --exclude='.env.*' --exclude='node_modules/' --exclude='tmp/' \
            --exclude='logs/' --exclude='uploads/' --exclude='public/uploads/' \
            --exclude='.htaccess' --exclude='.well-known/' \
            host-package/ "$TARGET:$HOST_APP_DIR/"

          "${SSH_OPTS[@]}" "$TARGET" "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --omit=dev --no-audit --no-fund
          mkdir -p tmp
          touch tmp/restart.txt
          REMOTE

          # Verify real HTTPS paths and the production MySQL API after restart.
          HEALTH_FILE="$(mktemp)"
          healthy=0
          for attempt in $(seq 1 15); do
            health_status="$(curl --silent --show-error --max-time 12 --output "$HEALTH_FILE" --write-out '%{http_code}' "$BASE_URL/api/health" 2>/dev/null)" || health_status="curl-error"
            if [[ "$health_status" == "200" ]] && node -e 'const fs=require("node:fs");let x;try{x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};if(!x||x.ok!==true||x.database!=="connected")process.exit(1)' "$HEALTH_FILE"; then
              healthy=1
              break
            fi
            sleep 4
          done
          if [[ "$healthy" != "1" ]]; then
            echo "::error::The deployed host did not report a healthy Node/MySQL API. Rollback will be attempted."
            head -c 300 "$HEALTH_FILE" || true
            rm -f "$HEALTH_FILE"
            exit 1
          fi
          rm -f "$HEALTH_FILE"

          for route in "/" "/madar/" "/madar/app/home"; do
            route_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$BASE_URL$route")" || route_status="curl-error"
            [[ "$route_status" == "200" ]] || { echo "::error::Post-deploy route check failed: $route returned HTTP $route_status"; exit 1; }
          done

          medar_file="$(mktemp)"
          medar_status="$(curl --silent --show-error --max-time 20 --output "$medar_file" --write-out '%{http_code}' "$BASE_URL/api/medar/api/health")" || medar_status="curl-error"
          if [[ "$medar_status" != "200" ]] || ! node -e 'const fs=require("node:fs");let x;try{x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};if(!x||x.ok!==true)process.exit(1)' "$medar_file"; then
            echo "::error::Post-deploy Medar API proxy health check failed (HTTP $medar_status)."
            head -c 300 "$medar_file" || true
            rm -f "$medar_file"
            exit 1
          fi
          rm -f "$medar_file"

          admin_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/admin/pages")" || admin_status="curl-error"
          case "$admin_status" in
            401|403) ;;
            *) echo "::error::Unauthenticated CMS admin access was not denied (HTTP $admin_status)."; exit 1 ;;
          esac

          DEPLOY_STARTED=0
          trap - EXIT
          if ! "${SSH_OPTS[@]}" "$TARGET" "bash -s" <<'REMOTE'
          set -euo pipefail
          BACKUP_DIR="$HOME/.razsahra-deploy-backups"
          find "$BACKUP_DIR" -maxdepth 1 -type f -name 'razsahra-*.tar.gz' -printf '%T@ %f\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | while IFS= read -r name; do rm -f -- "$BACKUP_DIR/$name"; done
          REMOTE
          then
            echo "::warning::Release is healthy, but old backup rotation did not finish."
          fi
          echo "HostMizbanFa deployment passed: homepage, Madar routes, MySQL health, Medar upstream proxy and protected CMS admin endpoint." >> "$GITHUB_STEP_SUMMARY"

      - name: State release limitation
        run: |
          echo "A staging ZIP with both Raz Sahara and the Medar web app was built. Medar API still proxies to the external operational Worker; do not treat as an independent Node/MySQL release. Host acceptance tests remain required." >> "$GITHUB_STEP_SUMMARY"
