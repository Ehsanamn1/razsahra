name: HostMizbanFa manual deployment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful GitHub Actions run ID that contains raz-sahra-host-package-staging"
        required: true
        type: string
      confirm_deploy:
        description: "Type DEPLOY to allow deployment"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hostmizbanfa-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST_SSH_HOST: ${{ secrets.HOST_SSH_HOST }}
      HOST_SSH_PORT: ${{ secrets.HOST_SSH_PORT }}
      HOST_SSH_USER: ${{ secrets.HOST_SSH_USER }}
      HOST_APP_DIR: ${{ vars.HOST_APP_DIR }}
      HOST_HEALTH_URL: ${{ vars.HOST_HEALTH_URL }}
    steps:
      - name: Validate host configuration before touching production
        shell: bash
        run: |
          set -euo pipefail
          for name in HOST_SSH_HOST HOST_SSH_PORT HOST_SSH_USER HOST_APP_DIR HOST_HEALTH_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret/variable: $name"
              exit 1
            fi
          done
          [[ "${HOST_SSH_PORT}" =~ ^[0-9]+$ ]] || { echo "::error::HOST_SSH_PORT must be numeric"; exit 1; }
          [[ "$HOST_APP_DIR" == /* ]] || { echo "::error::HOST_APP_DIR must be an absolute path"; exit 1; }
          [[ "$HOST_HEALTH_URL" == https://* ]] || { echo "::error::HOST_HEALTH_URL must use HTTPS"; exit 1; }
          [[ "${{ inputs.artifact_run_id }}" =~ ^[0-9]+$ ]] || { echo "::error::artifact_run_id must be numeric"; exit 1; }

      - name: Download prepared host package from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: raz-sahra-host-package-staging
          path: ./release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Validate package archive
        shell: bash
        run: |
          set -euo pipefail
          test -f release-artifact/raz-sahra-host-package.zip
          unzip -t release-artifact/raz-sahra-host-package.zip
          unzip -l release-artifact/raz-sahra-host-package.zip | grep -q 'server.js'
          unzip -l release-artifact/raz-sahra-host-package.zip | grep -q 'dist/madar/index.html'

      - name: Install SSH key and known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOST_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "::error::Missing secret HOST_SSH_PRIVATE_KEY"; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "::error::Missing secret HOST_SSH_KNOWN_HOSTS; do not use an unverified ssh-keyscan result."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH, Node.js and target path before deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$HOST_SSH_PORT" -o BatchMode=yes "$HOST_SSH_USER@$HOST_SSH_HOST" \
            "set -eu; command -v node; node -e 'if(Number(process.versions.node.split(".")[0])<20)process.exit(2)'; command -v npm; test -d \"$HOST_APP_DIR\"; test -w \"$HOST_APP_DIR\"; echo HOST_PREFLIGHT_OK"

      - name: Upload package to host staging area
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -P "$HOST_SSH_PORT" -o BatchMode=yes \
            release-artifact/raz-sahra-host-package.zip \
            "$HOST_SSH_USER@$HOST_SSH_HOST:/tmp/raz-sahra-host-package-${GITHUB_RUN_ID}.zip"

      - name: Back up, deploy, restart and health-check with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$HOST_SSH_PORT" -o BatchMode=yes "$HOST_SSH_USER@$HOST_SSH_HOST" \
            "HOST_APP_DIR='$HOST_APP_DIR' ARCHIVE='/tmp/raz-sahra-host-package-${GITHUB_RUN_ID}.zip' HEALTH_URL='$HOST_HEALTH_URL' RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          app="$HOST_APP_DIR"
          archive="$ARCHIVE"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="${app%/}.backup-$stamp"
          stage="${app%/}.release-$RUN_ID"
          mkdir -p "$app" "$stage"
          # Keep a restorable copy before changing anything. Never print .env.
          tar -C "$app" --exclude='./node_modules' -czf "$backup.tar.gz" . 2>/dev/null || true
          unzip -oq "$archive" -d "$stage"
          test -f "$stage/server.js"
          test -f "$stage/package.json"
          test -f "$stage/dist/index.html"
          test -f "$stage/dist/madar/index.html"
          # Preserve host-managed secrets and production dependencies between releases.
          rsync -a --delete --exclude='.env' --exclude='node_modules/' "$stage/" "$app/"
          cd "$app"
          npm ci --omit=dev --no-audit --no-fund
          mkdir -p tmp
          touch tmp/restart.txt
          # Passenger/cPanel convention; host must confirm this restart mechanism.
          sleep 3
          code="$(curl -sS -o /tmp/raz-sahra-health-"$RUN_ID".json -w '%{http_code}' --max-time 20 "$HEALTH_URL" || true)"
          if [ "$code" != "200" ] || ! grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/raz-sahra-health-"$RUN_ID".json; then
            echo "Health check failed; restoring the previous application files."
            if [ -s "$backup.tar.gz" ]; then
              find "$app" -mindepth 1 -maxdepth 1 ! -name '.env' ! -name 'node_modules' -exec rm -rf {} +
              tar -xzf "$backup.tar.gz" -C "$app"
              touch "$app/tmp/restart.txt" 2>/dev/null || true
            fi
            cat /tmp/raz-sahra-health-"$RUN_ID".json 2>/dev/null | head -c 500 || true
            exit 1
          fi
          echo "DEPLOY_OK"
          echo "Backup retained at: $backup.tar.gz"
          rm -rf "$stage" "$archive"
          REMOTE

      - name: Deployment summary
        if: success()
        run: |
          echo "Host deploy completed and health endpoint returned HTTP 200." >> "$GITHUB_STEP_SUMMARY"
          echo "A timestamped backup was retained on the host. Database schema changes are intentionally NOT run automatically." >> "$GITHUB_STEP_SUMMARY"
