name: Domestic host release package

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Optional label for the package (e.g. pilot-1)"
        required: false
        type: string
  push:
    branches: ["feat/mysql-domestic-hosting"]
    paths:
      - "server/**"
      - "functions/**"
      - "db/**"
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/domestic-release-package.yml"

permissions:
  contents: read

concurrency:
  group: domestic-host-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository checks
        run: npm run check
      - name: Build production site
        env:
          SITE_URL: https://raz-sahra.example.invalid/
          SITE_BUILD_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Verify deployable files and fail on missing runtime
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/madar/index.html
          test -s server/index.mjs
          test -s server/start-domestic.mjs
          test -s server/medar-api.mjs
          test -s server/cms-api.mjs
          test -s db/schema.sql
          ! grep -R -nE '(DATABASE_URL|MYSQL_URL|CLOUDFLARE_API_TOKEN)=.{12,}' --exclude='*.example' --exclude='*.md' dist server db functions
      - name: Assemble host bundle
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          label="${RELEASE_LABEL:-${SOURCE_SHA:0:12}}"
          mkdir -p release/raz-sahra
          cp -a dist server functions db scripts assets package.json release/raz-sahra/
          cp README.md release/raz-sahra/README.md
          cat > release/raz-sahra/RELEASE-METADATA.txt <<EOF
          project=raz-sahra-medar
          source_sha=${SOURCE_SHA}
          label=${label}
          built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          runtime=nodejs-22
          database=mysql-8.0+
          deployment=manual-host-upload-required
          EOF
          (cd release && tar -czf "raz-sahra-domestic-${label}.tar.gz" raz-sahra)
          sha256sum "release/raz-sahra-domestic-${label}.tar.gz" > "release/raz-sahra-domestic-${label}.tar.gz.sha256"
      - name: Upload host package (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: raz-sahra-domestic-host-${{ github.sha }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
